<div class="products-page">
  <!-- Header -->
  <section class="products-header py-5">
    <div class="container text-center text-white">
      <h1 class="display-3 fw-bold mb-3">Our Menu</h1>
      <p class="lead">Discover our delicious selection of handcrafted treats</p>
    </div>
  </section>

  <!-- Category Filter -->
  <section class="py-4 bg-light sticky-top">
    <div class="container">
      <div class="d-flex justify-content-center flex-wrap gap-2">
        <button 
          *ngFor="let category of categories"
          class="btn category-btn"
          [class.active]="selectedCategory === category"
          (click)="selectedCategory = category">
          {{ category }}
          <span *ngIf="category !== 'All'" class="badge bg-light text-dark ms-2">
            {{ getCategoryCount(category) }}
          </span>
        </button>
      </div>
    </div>
  </section>

  <!-- Products Grid -->
  <section class="py-5">
    <div class="container">
      <div class="row g-4" *ngIf="filteredProducts.length > 0; else noProducts">
        <div class="col-lg-4 col-md-6" *ngFor="let product of filteredProducts">
          <div class="product-card">
            <!-- Badges -->
            <div class="product-badges">
              <span *ngIf="product.isBestseller" class="badge bg-danger">
                <i class="bi bi-fire"></i> Bestseller
              </span>
              <span *ngIf="product.isNew" class="badge bg-success">
                <i class="bi bi-star-fill"></i> New
              </span>
            </div>

            <!-- Image -->
            <div class="product-image-wrapper">
              <img [src]="product.image" [alt]="product.name" class="product-image">
              <div class="product-overlay">
                <button class="btn btn-light btn-sm">
                  <i class="bi bi-eye"></i> Quick View
                </button>
              </div>
            </div>

            <!-- Info -->
            <div class="product-info">
              <span class="product-category">{{ product.category }}</span>
              <h4 class="product-name">{{ product.name }}</h4>
              <p class="product-description">{{ product.description }}</p>
              <div class="product-footer d-flex justify-content-between align-items-center">
                <div class="product-price">{{ formatPrice(product.price) }}</div>
                <button class="btn btn-primary">
                  <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- No Products -->
      <ng-template #noProducts>
        <div class="col-12 text-center py-5">
          <i class="bi bi-basket display-1 text-muted"></i>
          <h3 class="mt-3 text-muted">No products found</h3>
        </div>
      </ng-template>
    </div>
  </section>

  <!-- CTA Section -->
  <section class="cta-section py-5">
    <div class="container text-center text-white">
      <h2 class="display-4 fw-bold mb-4">Can't Decide?</h2>
      <p class="lead mb-4">Visit our store and let our staff help you choose!</p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <button class="btn btn-warning btn-lg">
          <i class="bi bi-geo-alt-fill"></i> Find Our Location
        </button>
        <button class="btn btn-outline-light btn-lg">
          <i class="bi bi-telephone-fill"></i> Call Us Now
        </button>
      </div>
    </div>
  </section>
</div>
